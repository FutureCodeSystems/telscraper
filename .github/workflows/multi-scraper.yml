name: Telegram Multi-Channel Scraper

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scrape-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Get all channels
        id: channels
        run: |
          if [ -d "channels" ]; then
            CHANNELS=$(ls -1 channels | jq -R . | jq -s . | jq -c .)
          else
            CHANNELS='[]'
          fi
          echo "channels=$CHANNELS" >> $GITHUB_OUTPUT
          echo "📺 Found channels: $CHANNELS"
          
      - name: Run scraper for all channels
        if: steps.channels.outputs.channels != '[]'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          ALL_CHANNELS: ${{ steps.channels.outputs.channels }}
        run: node multi-scraper.js
        
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🔄 Auto-update all channels (${{ github.run_number }})"
          file_pattern: 'channels/'
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"

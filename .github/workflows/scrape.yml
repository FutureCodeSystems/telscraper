name: Telegram Media Scraper

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'نام کانال (بدون @)'
        required: false
        default: 'devefun'
      max_posts:
        description: 'تعداد پست‌ها'
        required: false
        default: '40'

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Set environment variables
        run: |
          echo "CHANNEL=${{ inputs.channel || vars.CHANNEL || 'devefun' }}" >> $GITHUB_ENV
          echo "MAX_POSTS=${{ inputs.max_posts || vars.MAX_POSTS || '40' }}" >> $GITHUB_ENV
          
      - name: Run scraper
        env:
          CHANNEL: ${{ env.CHANNEL }}
          MAX_POSTS: ${{ env.MAX_POSTS }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scraper.js
        
      - name: Upload scraper output (artifact)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scraped-data-${{ env.CHANNEL }}
          path: channels/
          retention-days: 7
          
      - name: Commit and push changes
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "📊 Scraped @${{ env.CHANNEL }} - ${{ env.MAX_POSTS }} posts"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          file_pattern: 'channels/'

name: Telegram Media Scraper

on:
  schedule:
    - cron: '0 */12 * * *'  # هر ۱۲ ساعت
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel username (without @)'
        required: false
        default: 'devefun'

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
          
      - name: Setup Git LFS
        run: |
          git lfs install
          git lfs track "media/**"
          git add .gitattributes
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Run scraper
        env:
          CHANNEL: ${{ inputs.channel || vars.CHANNEL || 'devefun' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scraper.js
        
      - name: Commit and push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add data.json media/
          
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "📊 Update posts & media - $(date +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit"
          fi
